name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      formulas: ${{ steps.plan.outputs.formulas }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./scripts/test.sh static
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all='["afdata","afhttp","afmail","afpay","afpdf","afpsql","afslug","afui"]'
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_REF" || "$BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
            echo "formulas=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_REF" HEAD)
          if echo "$changed" | grep -Eq '^(scripts/|\.github/workflows/)'; then
            echo "formulas=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          formulas=$(echo "$changed" | sed -n 's|^Formula/\(.*\)\.rb$|\1|p' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "formulas=$formulas" >> "$GITHUB_OUTPUT"

  install:
    needs: static
    if: ${{ needs.static.outputs.formulas != '[]' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
        formula: ${{ fromJson(needs.static.outputs.formulas) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869
      - run: ./scripts/test.sh all "Formula/${{ matrix.formula }}.rb"
